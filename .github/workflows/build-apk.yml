name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🔨 Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 📁 Rename APK file
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Shree-Beauty-Studio.apk

      - name: 🚀 Upload APK Artifact (Downloadable from GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Shree-Beauty-Studio-Android-APK
          path: android/app/build/outputs/apk/debug/Shree-Beauty-Studio.apk
          retention-days: 30

      - name: 🏷️ Release APK to GitHub Releases (on manual trigger or tag)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/Shree-Beauty-Studio.apk
          name: "Shree Beauty Studio Android App v1.0.${{ github.run_number }}"
          tag_name: "v1.0.${{ github.run_number }}"
          body: |
            ## 📱 Shree Beauty Studio Android APK
            
            - **App Name:** Shree Beauty Studio
            - **Platform:** Android (APK)
            - **Package ID:** `com.shreebeautystudio.app`
            
            ### 📥 Installation Instructions:
            1. Download `Shree-Beauty-Studio.apk` to your Android phone.
            2. Tap on the downloaded file and select **Install**.
            3. (If prompted, allow "Install from unknown sources" in Android settings).
            4. Open the app and start managing your salon!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
