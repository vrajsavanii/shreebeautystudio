name: Daily 24-Hour Vercel Auto-Deploy

on:
  push:
    branches:
      - main
  schedule:
    # Runs every 24 hours at 00:00 UTC (05:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Deploy to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set in GitHub Repository Secrets!"
            exit 1
          fi
          npx vercel --token "$VERCEL_TOKEN" --prod --yes

      - name: Ping Search Engine IndexNow Network
        run: |
          curl -s -f "https://shreebeauty.studio/api/seo/indexnow" || true
